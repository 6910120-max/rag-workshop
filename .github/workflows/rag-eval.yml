name: rag-eval

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Workshop 4 targets
        run: pytest -q -m w4

      - name: Retrieval eval (dev)
        run: python -m rag.evaluate --split dev --method tfidf -k 4 --min-hit 0.9

      - name: Retrieval eval (dev, hybrid)
        run: python -m rag.evaluate --split dev --method hybrid -k 4 --min-hit 0.9
